<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mishika — Pretty Smart.</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --rose: #c9748a;
  --rose-light: #e8a0b4;
  --blush: #f4d4db;
  --cream: #fdf6f0;
  --lavender: #d4c5e8;
  --gold: #c9a96e;
  --charcoal: #1a1014;
  --muted: #8a7075;
  --glass: rgba(255,255,255,0.55);
  --glass-border: rgba(201,116,138,0.2);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  background: var(--cream);
  color: var(--charcoal);
  font-family: 'DM Sans', sans-serif;
  cursor: none;
  overflow-x: hidden;
}

/* ===== CUSTOM CURSOR ===== */
#cursor {
  position: fixed; width: 10px; height: 10px;
  background: var(--rose); border-radius: 50%;
  pointer-events: none; z-index: 99999;
  transition: transform 0.15s ease;
  mix-blend-mode: multiply;
}
#cursor-ring {
  position: fixed; width: 38px; height: 38px;
  border: 1.5px solid var(--rose); border-radius: 50%;
  pointer-events: none; z-index: 99998;
  transition: all 0.28s ease; opacity: 0.5;
}

/* ===== LOADING SCREEN ===== */
#loader {
  position: fixed; inset: 0; background: var(--charcoal);
  z-index: 999999; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.9s ease, visibility 0.9s ease;
}
#loader.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-logo {
  font-family: 'Playfair Display', serif;
  font-size: 4rem; color: #fdf6f0;
  letter-spacing: 0.06em; margin-bottom: 0.4rem;
  animation: fadeUp 0.8s ease forwards;
}
.loader-tag {
  color: var(--rose); font-size: 0.8rem;
  letter-spacing: 0.4em; text-transform: uppercase;
  animation: fadeUp 0.8s 0.2s ease both;
}
.loader-bar {
  width: 220px; height: 1px;
  background: rgba(255,255,255,0.1);
  margin-top: 2.5rem; overflow: hidden;
  animation: fadeUp 0.8s 0.4s ease both;
}
.loader-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--rose), var(--gold));
  animation: barFill 2s cubic-bezier(0.4,0,0.2,1) forwards;
}
.loader-pct {
  color: rgba(253,246,240,0.3); font-size: 0.72rem;
  letter-spacing: 0.2em; margin-top: 1rem;
  animation: fadeUp 0.8s 0.4s ease both;
}

/* ===== NAVBAR ===== */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  padding: 1.1rem 3.5rem;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(253,246,240,0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--glass-border);
  transition: var(--transition);
}
nav.scrolled { padding: 0.8rem 3.5rem; }
.nav-brand {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; color: var(--rose);
  font-style: italic; text-decoration: none;
}
.nav-links { display: flex; gap: 2.4rem; list-style: none; }
.nav-links a {
  font-size: 0.78rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
  text-decoration: none; transition: var(--transition);
  position: relative;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -3px; left: 0;
  width: 0; height: 1px; background: var(--rose);
  transition: width 0.3s ease;
}
.nav-links a:hover { color: var(--rose); }
.nav-links a:hover::after { width: 100%; }
.nav-hire {
  background: var(--charcoal); color: #fdf6f0;
  padding: 0.55rem 1.5rem; border-radius: 50px;
  font-size: 0.78rem; letter-spacing: 0.12em;
  text-transform: uppercase; border: none; cursor: none;
  transition: var(--transition);
}
.nav-hire:hover { background: var(--rose); transform: translateY(-1px); }

/* ===== FLOATING BUTTONS ===== */
.float-btn {
  position: fixed; right: 1.5rem; z-index: 900;
  border-radius: 50px; padding: 0.5rem 1.1rem;
  font-size: 0.72rem; letter-spacing: 0.1em;
  text-transform: uppercase; cursor: none;
  transition: var(--transition); border: none;
}
#btn-barbie {
  top: 5.5rem;
  background: var(--glass); color: var(--rose);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(8px);
}
#btn-barbie:hover { background: var(--rose); color: #fff; }
#btn-recruiter {
  top: 8.2rem;
  background: var(--charcoal); color: #fdf6f0;
}
#btn-recruiter:hover { background: var(--rose); }

/* ===== HERO ===== */
.hero-wrapper {
  position }
