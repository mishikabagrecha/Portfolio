<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c9748a" />
    <meta name="description" content="Mishika — AI/ML Engineer | Pretty Smart." />
    <title>Mishika — Pretty Smart.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #fdf6f0; }
      #cursor {
        position: fixed; width: 10px; height: 10px;
        background: #c9748a; border-radius: 50%;
        pointer-events: none; z-index: 99999;
        transition: transform 0.15s ease;
        mix-blend-mode: multiply;
      }
      #cursor-ring {
        position: fixed; width: 38px; height: 38px;
        border: 1.5px solid #c9748a; border-radius: 50%;
        pointer-events: none; z-index: 99998;
        transition: all 0.28s ease; opacity: 0.5;
      }
      body.cursor-hover #cursor { transform: scale(2.5); }
      body.cursor-hover #cursor-ring { transform: scale(1.5); opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="cursor"></div>
    <div id="cursor-ring"></div>
    <div id="root"></div>
  </body>
</html>
